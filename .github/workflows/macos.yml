name: macos

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "FFmpeg version (X.Y or X.Y.Z)"
        required: true
      publish:
        description: "Upload the builds to the release v<version>"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.job.target }} (${{ matrix.variant }})
    runs-on: ${{ matrix.job.runs-on }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}-${{ matrix.job.target }}-${{ matrix.variant }}
      cancel-in-progress: true
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: arm64-apple-darwin, runs-on: macos-15 }
          - { target: x86_64-apple-darwin, runs-on: macos-15-intel }
        variant: [full, skeleton]

    steps:
      - name: Resolve the FFmpeg version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Install nasm
        if: matrix.job.target == 'x86_64-apple-darwin' && matrix.variant == 'full'
        run: brew install nasm

      - name: Build
        run: bash .github/build-ffmpeg.sh "${{ steps.version.outputs.version }}" "${{ matrix.variant }}" "${{ matrix.job.target }}" build

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.version.outputs.version }}-${{ matrix.job.target }}-${{ matrix.variant }}
          path: |
            build/*.tar.gz
            build/*.sha256

      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' || inputs.publish
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            build/*.tar.gz
            build/*.sha256
