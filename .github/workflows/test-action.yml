name: test-action

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'install-ffmpeg.sh'
      - '.github/workflows/test-action.yml'
  pull_request:
    paths:
      - 'action.yml'
      - 'install-ffmpeg.sh'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.runs-on }} (${{ matrix.variant }} ${{ matrix.ffmpeg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest,    variant: full,     ffmpeg: '~> 9.0' }
          - { runs-on: ubuntu-latest,    variant: skeleton, ffmpeg: '4.0.6' }
          - { runs-on: ubuntu-24.04-arm, variant: full,     ffmpeg: '>= 8.0' }
          - { runs-on: macos-15,         variant: full,     ffmpeg: '9.0.2' }
          - { runs-on: macos-15-intel,   variant: skeleton, ffmpeg: '~> 7.0' }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        id: ffmpeg
        uses: ./
        with:
          ffmpeg_version: ${{ matrix.ffmpeg }}
          variant: ${{ matrix.variant }}
      - name: Verify
        env:
          PKG_CONFIG_PATH: ${{ steps.ffmpeg.outputs.pkg-config-path }}
        run: |
          echo "requested '${{ matrix.ffmpeg }}' -> resolved '${{ steps.ffmpeg.outputs.ffmpeg-version }}' (${{ steps.ffmpeg.outputs.triplet }}, ${{ steps.ffmpeg.outputs.variant }})"
          pkg-config --modversion libavcodec
          pkg-config --cflags --libs libavformat
          if [ "${{ matrix.variant }}" = full ]; then
            ffmpeg -hide_banner -version | head -n 1
          fi

  test-musl:
    # Local actions (uses: ./) don't path-map into container jobs, so run the
    # script directly to exercise the musl triplet detection and download.
    name: alpine musl (full ~> 9.0)
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - run: apk add --no-cache bash curl tar git pkgconf
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: INPUT_FFMPEG_VERSION='~> 9.0' bash install-ffmpeg.sh
      - name: Verify
        run: |
          PKG_CONFIG_PATH="$PWD/.ffmpeg/lib/pkgconfig" pkg-config --modversion libavcodec
          .ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1

  test-container:
    # Runs the published action the way container jobs consume it.
    name: ubuntu:24.04 container (full ~> 9.0)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - run: apt-get update -q && apt-get install -y --no-install-recommends curl ca-certificates pkg-config
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        id: ffmpeg
        uses: ./
        with:
          ffmpeg_version: '~> 9.0'
      - name: Verify
        env:
          PKG_CONFIG_PATH: ${{ steps.ffmpeg.outputs.pkg-config-path }}
        run: |
          pkg-config --modversion libavcodec
          ffmpeg -hide_banner -version | head -n 1
